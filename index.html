<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="slyle.css">
    <title>Login Firebase</title>
</head>
<body>   
     <div class="intro">
        <h4>Seja Bem-vindo! Sabor Raiz</h4>   
        <p>Faça seu login para acessar o nosso site</p>
        <p>Ao acessar o site, você poderá desfrutar de nossos produtos e serviços exclusivos.</p>
    </div>
    <div class="container">
        <h2>Login</h2>

        <div class="input-group">  
            <label>Digite seu Nome</label>
            <input type="text" id="nome" placeholder="Digite seu nome">
        </div>
        <div class="input-group">  
            <label>Digite seu E-mail</label>
            <input type="email" id="email" placeholder="meuemail5@email.com">
        </div>
        <div class="input-group">
            <label>Digite sua senha</label>
            <input type="password" id="senha" placeholder="Android123@">
        </div>

        <button onclick="entrar()">Entrar</button>
        <button onclick="cadastro()">Cadastro</button>
        <p id="mensagem"></p>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
    <script src="script.js"></script>

    <script>
        function entrar() {
            window.location.assign("home.html");
        }

        function cadastro() {
            alert("Olá! Será encaminhado para o cadastro.");
            document.getElementById("mensagem").innerText = "Redirecionando...";
        }
    </script>
</body>
</html>
