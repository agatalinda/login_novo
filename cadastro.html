<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="style.css">
    <title>Cadastro</title>

</head>
<body class="cadastro" >
    
    <div class="containerin">
    <h2>Faça seu cadastro</h2>
    <form id="cadastrarForm">

        <input class="" type="text" id="nome" name="nome" required  placeholder="Digite seu nome">
        
        
        <input type="email" id="email" name="email" required placeholder="Digite seu E-mail">
       
       
        <input type="tel" id="telefone" name="telefone" pattern="\d{10,11}" placeholder="Apenas números" required>
        
      
        <input type="text" id="cpf" name="cpf" pattern="\d{11}" placeholder="00000000000" required>

        
   
    
        <div class="error" id="errorMsg"></div>
        <button id="buttoncadastro"  type="submit">Cadastrar</button>
    </form>
</div>
<script src="script.js"></script>
    
</body>
</html>
    
</body>
</html>
